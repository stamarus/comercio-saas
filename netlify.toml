[build]
  publish = "."

[build.processing]
  skip_processing = true

[build.processing.html]
  pretty_urls = true

[[redirects]]
  from = "/admin-saas"
  to = "/admin-saas.html"
  status = 200

[[redirects]]
  from = "/criar-loja"
  to = "/criar-loja.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
